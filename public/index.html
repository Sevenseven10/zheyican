<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F2ED" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="这一餐" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <title>这一餐</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        width: 100%;
        height: var(--app-viewport-height, 100vh);
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html,
      body {
        margin: 0;
        background: #F3F2ED;
      }
      body,
      button,
      input,
      textarea,
      select {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        flex: 1 1 auto;
      }
      #root [dir="auto"] {
        line-height: 1.2;
      }
      #root :where(input, textarea, select, button, [role="button"], [tabindex]) {
        -webkit-tap-highlight-color: transparent;
      }
      #root :where(input, textarea, select, button, [role="button"], [tabindex]):focus {
        outline: none;
        box-shadow: none;
      }
      @media (hover: hover) and (pointer: fine) {
        #root :where(input, textarea, select, button, [role="button"], [tabindex]):focus-visible {
          outline: 2px solid rgba(185, 79, 56, 0.62);
          outline-offset: 2px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>需要启用 JavaScript 才能使用「这一餐」。</noscript>
    <div id="root"></div>
  </body>
</html>
