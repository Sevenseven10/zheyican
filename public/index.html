<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F2ED" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="这一餐" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <title>这一餐</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
      }
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
          min-height: 100dvh;
        }
      }
      @media (display-mode: standalone) {
        html,
        body,
        #root {
          height: 100vh;
          min-height: 100vh;
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html,
      body {
        margin: 0;
        background: #F3F2ED;
      }
      body,
      button,
      input,
      textarea,
      select {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        flex: 1 1 auto;
      }
      #root [dir="auto"] {
        line-height: 1.2;
      }
      #root :where(input, textarea, select, button, [role="button"], [tabindex]) {
        -webkit-tap-highlight-color: transparent;
      }
      #root :where(input, textarea, select, button, [role="button"], [tabindex]):focus {
        outline: none;
        box-shadow: none;
      }
      @media (hover: hover) and (pointer: fine) {
        #root :where(input, textarea, select, button, [role="button"], [tabindex]):focus-visible {
          outline: 2px solid rgba(185, 79, 56, 0.62);
          outline-offset: 2px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>需要启用 JavaScript 才能使用「这一餐」。</noscript>
    <div id="root"></div>
<script>
(function(){
  var box=document.createElement('div');
  box.style.cssText='position:fixed;top:0;left:0;z-index:2147483646;background:rgba(0,0,0,.92);color:#0ff;font:10px/1.4 monospace;padding:6px 8px;max-width:100vw;max-height:90vh;overflow:auto;white-space:pre-wrap;word-break:break-all;pointer-events:auto;-webkit-user-select:text;user-select:text';
  box.setAttribute('data-temp-boot','sentinel');
  var lines=[];
  var stage='HTML_INLINE_RUNNING';
  function pad(n){return String(n).padStart(2,'0')}
  function ts(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0')}
  function add(l){lines.push(l)}
  function paint(){box.textContent='TEMP BOOT DEBUG | STAGE:'+stage+'\n'+lines.join('\n')}
  add('TIME: '+ts());
  add('URL: '+location.href);
  add('ONLINE: '+navigator.onLine);
  add('READY_STATE: '+document.readyState);
  var ctrl=navigator.serviceWorker&&navigator.serviceWorker.controller;
  add('SW_CONTROLLER: '+(ctrl?ctrl.scriptURL:'null'));
  add('CONTROLLER_STATE: '+(ctrl&&ctrl.scriptURL?'active':'none'));
  add('');
  stage='HTML_INLINE_RUNNING';
  paint();
  document.addEventListener('DOMContentLoaded',function(){lines.push('EVENT: DOMContentLoaded readyState='+document.readyState);paint()});
  window.addEventListener('load',function(){lines.push('EVENT: load readyState='+document.readyState);paint()});
  window.addEventListener('error',function(e){lines.push('EVENT: error msg='+(e.message||'?')+' src='+(e.filename||e.target&&e.target.src||'?')+' line='+(e.lineno||'?')+' col='+(e.colno||'?'));stage='ERROR';paint()},true);
  window.addEventListener('unhandledrejection',function(e){var r=e.reason;lines.push('EVENT: unhandledrejection reason='+(typeof r==='string'?r.slice(0,200):r&&r.message?r.message.slice(0,200):String(r).slice(0,200)));stage='ERROR';paint()});
  add('');
  add('--- BOOT ASSET CACHE ---');
  var scripts=document.querySelectorAll('script[src]');
  var links=document.querySelectorAll('link[rel="stylesheet"]');
  var bootUrls=[];
  for(var i=0;i<scripts.length;i++)bootUrls.push(scripts[i].getAttribute('src'));
  for(var i=0;i<links.length;i++)bootUrls.push(links[i].getAttribute('href'));
  add('BOOT_URLS: '+bootUrls.length);
  if(window.caches&&caches.keys){
    caches.keys().then(function(names){
      add('CACHE_NAMES: '+JSON.stringify(names));
      var genNames=names.filter(function(n){return n.indexOf('zheyican-shell-')===0});
      add('SHELL_GENERATIONS: '+JSON.stringify(genNames));
      return Promise.all(bootUrls.map(function(url){
        return caches.match(url).then(function(hit){
          add('BOOT_ASSET: '+url);
          add('  CACHE_HIT: '+(hit?'YES':'NO'));
        });
      }));
    }).then(function(){paint()}).catch(function(e){add('CACHE_ERROR: '+e.message);paint()});
  }else{add('CACHE_API: unavailable');}
  paint();
  window.__TEMP_BOOT_DEBUG={setStage:function(s){stage=s;paint()},addLine:function(l){lines.push(l);paint()}};
  document.body.appendChild(box);
})();
</script>
  </body>
</html>
